services:
  postgres:
    image: postgres:16-alpine
    container_name: ap_invoice_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: invoicedb
    ports:
      - "5432:5432"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./scripts/create_readonly_role.sql:/docker-entrypoint-initdb.d/02_create_readonly_role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoicedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ap_invoice_prod_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ap_invoice_prod_api
    restart: always
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:devpassword@postgres:5432/invoicedb
      DATABASE_URL_RO: postgresql+asyncpg://invoice_ro:ro_password@postgres:5432/invoicedb
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /app/data/uploads
      API_KEY: ${API_KEY:-test-api-key-12345}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_volume:/app/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ap_invoice_prod_worker
    restart: always
    command: python -m arq app.workers.worker.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:devpassword@postgres:5432/invoicedb
      DATABASE_URL_RO: postgresql+asyncpg://invoice_ro:ro_password@postgres:5432/invoicedb
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /app/data/uploads
      API_KEY: ${API_KEY:-test-api-key-12345}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - uploads_volume:/app/data/uploads

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ap_invoice_prod_ui
    restart: always
    command: streamlit run ui/Home.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-test-api-key-12345}
    depends_on:
      api:
        condition: service_started

volumes:
  prod_postgres_data:
  prod_redis_data:
  uploads_volume:

