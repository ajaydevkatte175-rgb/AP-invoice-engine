[project]
name = "ap-invoice-engine"
version = "0.1.0"
description = "AP Invoice Engine - Inbound accounts payable and outbound invoice platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "anthropic>=0.40.0",
    "pypdf>=5.1.0",
    "pdfplumber>=0.11.4",
    "pdf2image>=1.17.0",
    "pillow>=11.0.0",
    "opencv-python-headless>=4.10.0",
    "reportlab>=4.2.5",
    "sqlglot>=26.1.0",
    "streamlit>=1.40.0",
    "plotly>=5.24.1",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.19",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ailayer", "ui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "N999", "S110", "DTZ005", "DTZ011", "SIM102", "SIM117"]

